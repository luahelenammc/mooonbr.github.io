name: Habbo V17 missing staff sprite research
on:
  push:
    branches: [feat/habbo-v17-classic-staff-sprite-rail]
    paths:
      - 'habbo/v17/probe-remaining.mjs'
      - '.github/workflows/habbo-v17-remaining.yml'
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node habbo/v17/probe-remaining.mjs
