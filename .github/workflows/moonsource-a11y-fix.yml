name: Moon Source Accessibility Fix

on:
  push:
    branches:
      - feat/moonsource-public-index-v2
    paths:
      - '.github/workflows/moonsource-a11y-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/moonsource-public-index-v2
          fetch-depth: 0

      - name: Apply source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('moonsource/assets/site.css'): [
                  ('--ink-faint: #69736f;', '--ink-faint: #505a56;'),
                  ('--mint: #0a806d;', '--mint: #086b5d;'),
                  ('--coral: #b34e62;', '--coral: #96364b;'),
              ],
              Path('moonsource/index.html'): [
                  ('<a class="brand" href="/moonsource/" aria-label="Moon Source, início">', '<a class="brand" href="/moonsource/">'),
              ],
              Path('moonsource/tests/browser.mjs'): [
                  ("const artifactRoot = path.resolve('moonsource/review-artifacts');", "const artifactRoot = path.resolve('review-artifacts');"),
              ],
          }

          for file_path, pairs in replacements.items():
              text = file_path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected source in {file_path}: {old}')
                  text = text.replace(old, new, 1)
              file_path.write_text(text, encoding='utf-8')
              print(f'updated {file_path}')
          PY

      - name: Run structural checks
        run: npm --prefix moonsource test

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moonsource/assets/site.css moonsource/index.html moonsource/tests/browser.mjs
          git commit -m 'fix(moonsource): pass accessibility review'
          git push
