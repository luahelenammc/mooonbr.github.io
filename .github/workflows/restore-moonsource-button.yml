name: Restore Moon Source Button

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-moonsource-button.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore historical main-download interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('moonsource/index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '''.main-download{display:flex;align-items:center;justify-content:center;gap:12px;min-height:76px;width:100%;padding:18px 28px;border-radius:999px;color:#041314;text-decoration:none;font-size:clamp(1.06rem,2vw,1.32rem);font-weight:950;letter-spacing:-.035em;background:linear-gradient(120deg,var(--mint),var(--sun) 39%,var(--peach) 72%,var(--coral));box-shadow:0 18px 50px rgba(125,247,207,.20);transition:.25s}.main-download:after{content:"↓";display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:rgba(4,19,20,.14)}.main-download:hover{transform:translateY(-4px) scale(1.015)}'''

          restored_css = '''.main-download{--mx:50%;--my:50%;position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:12px;min-height:76px;width:100%;padding:18px 28px;border-radius:999px;border:0;overflow:hidden;color:#041314;text-decoration:none;font-size:clamp(1.06rem,2vw,1.32rem);font-weight:950;letter-spacing:-.035em;background:radial-gradient(circle at var(--mx) var(--my),#fff7b8 0%,transparent 24%),linear-gradient(120deg,var(--mint) 0%,var(--sun) 39%,var(--peach) 72%,var(--coral) 100%);box-shadow:0 18px 50px rgba(125,247,207,.20),0 0 0 1px rgba(255,255,255,.5) inset;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease,filter .28s ease;animation:buttonBreathe 2.6s ease-in-out infinite}.main-download:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 0%,rgba(255,255,255,.8) 38%,transparent 55%),repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 18px,rgba(255,255,255,.12) 18px 19px);transform:translateX(-130%);animation:buttonShine 2.4s cubic-bezier(.2,.8,.2,1) infinite}.main-download:after{content:"↓";display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:rgba(4,19,20,.14);box-shadow:inset 0 0 0 1px rgba(4,19,20,.16);animation:arrowDrop 1.4s ease-in-out infinite}.main-download:hover,.main-download:focus-visible{transform:translateY(-4px) scale(1.015);filter:saturate(1.12) brightness(1.04);box-shadow:0 24px 70px rgba(125,247,207,.30),0 0 46px rgba(255,240,106,.20),0 0 0 1px rgba(255,255,255,.65) inset;outline:none}@keyframes buttonBreathe{0%,100%{box-shadow:0 18px 50px rgba(125,247,207,.18),0 0 0 1px rgba(255,255,255,.5) inset}50%{box-shadow:0 24px 70px rgba(255,240,106,.24),0 0 32px rgba(125,247,207,.16),0 0 0 1px rgba(255,255,255,.62) inset}}@keyframes buttonShine{0%,35%{transform:translateX(-130%)}70%,100%{transform:translateX(130%)}}@keyframes arrowDrop{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}'''

          old_motion = '''@media(prefers-reduced-motion:reduce){*{transition:none!important}.main-download:hover,.small-card:hover,.extra-pack:hover{transform:none}}'''
          restored_motion = '''@media(prefers-reduced-motion:reduce){*{transition:none!important}.main-download,.main-download:before,.main-download:after{animation:none!important}.main-download:hover,.main-download:focus-visible,.small-card:hover,.extra-pack:hover{transform:none}}'''

          old_script = '''document.querySelectorAll('[data-lang-choice]').forEach(b=>b.onclick=()=>setLang(b.dataset.langChoice));const q='''
          restored_script = '''document.querySelectorAll('[data-lang-choice]').forEach(b=>b.onclick=()=>setLang(b.dataset.langChoice));document.querySelectorAll('.main-download').forEach(btn=>{btn.addEventListener('pointermove',event=>{const rect=btn.getBoundingClientRect();btn.style.setProperty('--mx',`${event.clientX-rect.left}px`);btn.style.setProperty('--my',`${event.clientY-rect.top}px`)})});const q='''

          for old, new, label in [
              (old_css, restored_css, 'main-download CSS'),
              (old_motion, restored_motion, 'reduced-motion guard'),
              (old_script, restored_script, 'pointer spotlight script'),
          ]:
              if old not in text:
                  raise SystemExit(f'Expected {label} source was not found; refusing broad edit')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Restored historical Moon Source main-download interaction only.')
          PY

      - name: Verify surgical scope
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = 'moonsource/index.html '
          grep -q 'animation:buttonBreathe 2.6s' moonsource/index.html
          grep -q "addEventListener('pointermove'" moonsource/index.html

      - name: Commit restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moonsource/index.html
          git commit -m 'fix(moonsource): restore original animated download button'
          git push
