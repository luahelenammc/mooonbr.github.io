name: Moon Source Method Contrast Fix

on:
  push:
    branches:
      - feat/moonsource-public-index-v2
    paths:
      - '.github/workflows/moonsource-method-contrast-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/moonsource-public-index-v2
          fetch-depth: 0

      - name: Apply contextual contrast rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('moonsource/assets/site.css')
          text = path.read_text(encoding='utf-8')
          marker = '.method-section .section-index { border-color: color-mix(in srgb, currentColor 20%, transparent); color: color-mix(in srgb, currentColor 65%, transparent); }'
          addition = marker + '\n.method-section .eyebrow, .method-section .section-index span:first-child { color: var(--mint-bright); }'
          if marker not in text:
              raise SystemExit('Method section marker not found')
          if 'method-section .eyebrow, .method-section .section-index span:first-child' not in text:
              text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run structural checks
        run: npm --prefix moonsource test

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moonsource/assets/site.css
          git commit -m 'fix(moonsource): restore contrast in dark method panel'
          git push
