name: Habbo V17 source-only historical manager sprite audit
on:
  push:
    branches: [feat/habbo-v17-classic-manager-sprite-rail]
    paths:
      - 'habbo/v17/audit.mjs'
      - '.github/workflows/habbo-v17-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node habbo/v17/audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: habbo-v17-manager-source-pages
          path: habbo/v17/source-audit/
