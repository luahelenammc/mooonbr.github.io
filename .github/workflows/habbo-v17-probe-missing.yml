name: Habbo V17 probe missing historical staff renders
on:
  push:
    branches: [feat/habbo-v17-classic-manager-sprite-rail]
    paths:
      - 'habbo/v17/probe-missing.mjs'
      - '.github/workflows/habbo-v17-probe-missing.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node habbo/v17/probe-missing.mjs
